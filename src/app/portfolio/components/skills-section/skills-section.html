<section id="skills" class="relative min-h-screen bg-black text-white overflow-hidden">
  <div class="transition-all duration-500"
    [ngClass]="{'xl:ml-[280px]': isSidebarOpen, 'ml-0': !isSidebarOpen}">

    <!-- Background Glow Blobs -->
    <div class="absolute -top-40 -left-40 w-[500px] h-[500px] bg-white/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-[400px] h-[300px] bg-white/10 rounded-full blur-3xl"></div>

    <div class="relative max-w-7xl mx-auto px-6 py-28">

      <!-- HEADER -->
      <span class="inline-block mb-6 px-4 py-1 rounded-full bg-white/10 text-sm tracking-widest uppercase">
        Skills
      </span>

      <h2 class="text-4xl sm:text-5xl font-light mb-20">
        My <span class="font-medium bg-gradient-to-b from-[#ffd166] via-[#ffb703] to-[#9d0208] bg-clip-text text-transparent">
          Superpowers</span>
      </h2>

      <!-- ── FRONTEND ── -->
      <div class="mb-16">
        <div class="flex items-center gap-3 mb-8">
          <div class="w-8 h-[2px] bg-gradient-to-r from-[#f2f2f2] via-[#cfcfcf] to-[#9e9e9e]"></div>
          <span class="reveal delay-400 text-[23px] sm:text-[1.5rem] font-bold leading-tight bg-gradient-to-b from-[#ffd166] via-[#ffb703] to-[#9d0208] bg-clip-text text-transparent">
            Frontend Frameworks
          </span>
          <div class="flex-1 h-[0.5px] bg-white/10"></div>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6 frontend-group">

          <!-- Angular -->
          <div class="skill-card group backdrop-blur-md hover:-translate-y-2 transition-all duration-300 relative overflow-hidden"
            (mousemove)="onGlowMove($event)" (mouseleave)="onGlowLeave()"
            [style.--x]="glowX" [style.--y]="glowY">
            <div class="pointer-events-none absolute inset-0 rounded-3xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"
              style="padding:3px;background:radial-gradient(280px circle at var(--x) var(--y),rgba(255,0,0,.9),rgba(255,0,0,.5) 22%,rgba(255,0,0,.15) 38%,transparent 48%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;"></div>
            <div class="flex items-center justify-center mb-6 h-14">
              <img src="assets/Angular.png" class="h-12" alt="Angular" />
            </div>
            <p class="text-center text-sm text-white/60">Angular</p>
          </div>

          <!-- React Native -->
          <div class="skill-card group backdrop-blur-md hover:-translate-y-2 transition-all duration-300 relative overflow-hidden"
            (mousemove)="onGlowMove($event)" (mouseleave)="onGlowLeave()"
            [style.--x]="glowX" [style.--y]="glowY">
            <div class="pointer-events-none absolute inset-0 rounded-3xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"
              style="padding:3px;background:radial-gradient(280px circle at var(--x) var(--y),rgba(255,0,0,.9),rgba(255,0,0,.5) 22%,rgba(255,0,0,.15) 38%,transparent 48%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;"></div>
            <div class="flex items-center justify-center mb-6 h-14">
              <img src="assets/react-native.png" class="h-12" alt="React Native" />
            </div>
            <p class="text-center text-sm text-white/60">React Native</p>
          </div>

          <!-- JavaScript -->
          <div class="skill-card group backdrop-blur-md hover:-translate-y-2 transition-all duration-300 relative overflow-hidden"
            (mousemove)="onGlowMove($event)" (mouseleave)="onGlowLeave()"

            </div>
            <p class="text-center text-sm text-white/60">React.js</p>
          </div>

        </div>
      </div>
