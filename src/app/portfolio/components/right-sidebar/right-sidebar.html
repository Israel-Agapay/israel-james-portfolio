<aside
  class=" fixed right-0 top-0 h-screen w-[0px] transition-all duration-500 ease-out z-40"
  [ngClass]="{
    'opacity-100 translate-x-0 pointer-events-auto sidebar-show': isRightSidebarVisible,
    'opacity-0 translate-x-20 pointer-events-none': !isRightSidebarVisible
  }">

  <div
    class="fixed right-6 top-1/2 -translate-y-1/2 z-50 flex flex-col items-center gap-4 px-4 py-6
           rounded-2xl bg-black/15 backdrop-blur-3lg border border-white/15">

   <button (click)="scrollTo('home')" class="sidebar-icon sidebar-item group relative"
      [class.active]="activeSection === 'home'">
      <span class="tooltip">Home</span>
      <i class="fa-solid fa-house"></i>
    </button>

    <button (click)="scrollTo('about')" class="sidebar-icon sidebar-item group relative"
      [class.active]="activeSection === 'about'">
      <span class="tooltip">About</span>
      <i class="fa-solid fa-user"></i>
    </button>

    <button (click)="scrollTo('skills')" class="sidebar-icon sidebar-item group relative"
      [class.active]="activeSection === 'skills'">
      <span class="tooltip">Skills</span>
      <i class="fa-solid fa-code"></i>
    </button>

    <button (click)="scrollTo('projects')" class="sidebar-icon sidebar-item group relative"
      [class.active]="activeSection === 'projects'">
      <span class="tooltip">Projects</span>
      <i class="fa-solid fa-briefcase"></i>
    </button>

    <button (click)="scrollTo('contact')" class="sidebar-icon sidebar-item group relative"
      [class.active]="activeSection === 'contact'">
      <span class="tooltip">Contact</span>
      <i class="fa-solid fa-envelope"></i>
    </button>

    <button
      (click)="hideSidebar()"
      class="sidebar-item mb-3 w-8 h-3 rounded-full flex items-center justify-center
             text-white/60 hover:text-red-400 transition"
      title="Hide sidebar">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
</aside>
