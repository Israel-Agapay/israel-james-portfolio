    [isRightSidebarVisible]="isRightSidebarVisible"
    [activeSection]="activeSection"
    (hide)="isRightSidebarVisible = false">

  <app-hero-section 
    [isSidebarOpen]="isSidebarOpen">

  <app-goal-section

    [isSidebarOpen]="isSidebarOpen">

  <app-skills-section 
    [isSidebarOpen]="isSidebarOpen">
  </app-skills-section>

  <app-education-section 
    [isSidebarOpen]="isSidebarOpen">
  </app-education-section>

  <app-projects-section 
    [isSidebarOpen]="isSidebarOpen">
  </app-projects-section>

  <app-service-section 
    [isSidebarOpen]="isSidebarOpen">
  </app-service-section>

  <app-contact-section 
    [isSidebarOpen]="isSidebarOpen">

  <app-footer></app-footer>
